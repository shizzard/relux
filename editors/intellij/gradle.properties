# Plugin version (managed by release-please). The start/end markers below are
# load bearing: java.util.Properties does not treat a trailing `#` as a comment,
# so the single-line marker form left its annotation inside the value Gradle
# read. Keep version numbers out of this comment -- the updater rewrites them
# here too, which would quietly falsify whatever it claims.
# x-release-please-start-version
version = 0.8.3
# x-release-please-end

# IntelliJ Platform
platformVersion = 2024.3

# Java version
javaVersion = 17
