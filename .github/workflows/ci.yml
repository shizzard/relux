name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore file timestamps
        uses: chetan/git-restore-mtime-action@v2

      # Cheap and toolchain-free, so it runs before anything is installed.
      - name: ASCII check
        run: ./.scripts/check-ascii.sh

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('crates/**', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-lint-

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        run: rustup run nightly rustfmt --edition 2024 --check $(find crates -name '*.rs')

      - name: Generate viewer TS bindings
        run: cargo test -p relux-runtime --features ts-export 'export_bindings_'

      - name: Build viewer bundle and refresh vendored copy
        run: |
          docker run --rm -v "$PWD/viewer":/src -w /src node:lts-slim \
              sh -c 'npm ci && npm run build'
          cp viewer/dist/relux-viewer.js.gz crates/relux-runtime/vendor/relux-viewer.js.gz

      - name: Verify vendored bundle is in sync
        run: git diff --exit-code -- crates/relux-runtime/vendor/relux-viewer.js.gz

      # The bundles being in sync is not enough -- they also have to reach
      # crates.io. `release.yml` publishes with `--no-verify`, so nothing else
      # checks that the packaged crate carries them, and a crate that omits
      # them yields a `cargo install relux` whose viewer is broken. Derived
      # from the directory rather than hardcoded so a vendored file added or
      # renamed later is covered without touching this step.
      # `--list` rather than building the tarball: packaging rewrites path
      # dependencies into registry requirements, so on the release branch it
      # tries to resolve a relux-core version that is not published until that
      # very release, and fails. Listing needs no resolution and still reports
      # exactly which files cargo would include.
      - name: Verify vendored bundles ship in the packaged crate
        run: |
          listed=$(cargo package --list -p relux-runtime)
          missing=0
          for path in crates/relux-runtime/vendor/*; do
            name="vendor/${path##*/}"
            if grep -qxF "$name" <<<"$listed"; then
              echo "  ok: $name"
            else
              echo "::error::$name would not be included in the packaged relux-runtime crate"
              missing=1
            fi
          done
          exit "$missing"

  # Its own job rather than a step in `lint`, to match `intellij`: as a trailing
  # lint step it had no check of its own in the pull request list, and any
  # earlier failure -- clippy, rustfmt, the viewer bundle -- skipped it, so the
  # editor packaging silently went unverified exactly when something else was
  # already wrong.
  vscode:
    name: VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check the extension packages cleanly
        run: |
          mkdir -p editors/vscode/build
          docker run --rm -v "$PWD/editors/vscode":/src -w /src node:lts-slim \
              sh -c 'npx --yes @vscode/vsce package --out /src/build/relux-check.vsix 2>&1 | tee /tmp/vsce.log && ! grep -E "WARNING|ERROR" /tmp/vsce.log'

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore file timestamps
        uses: chetan/git-restore-mtime-action@v2

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('crates/**', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-test-

      - name: Unit tests
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --workspace

  intellij:
    name: IntelliJ Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Same pin as `.github/workflows/release.yml` -- keep the two in step.
      # Building here is the whole point of this job: an unbuildable plugin
      # should fail on the pull request, not at the release tag, where the
      # only way to ship a fix is to move a published tag.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.6.1

      - name: Build IntelliJ plugin
        working-directory: editors/intellij
        run: gradle buildPlugin

  build:
    name: Build (${{ matrix.target || matrix.os }})
    needs: [lint, test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore file timestamps
        uses: chetan/git-restore-mtime-action@v2

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.target || matrix.os }}-cargo-build-dev-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('crates/**', 'Cargo.toml') }}
          restore-keys: |
            ${{ matrix.target || matrix.os }}-cargo-build-dev-${{ hashFiles('**/Cargo.lock') }}-
            ${{ matrix.target || matrix.os }}-cargo-build-dev-

      - name: Build
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            rustup target add "${{ matrix.target }}"
            cargo build -p relux --target "${{ matrix.target }}"
          else
            cargo build -p relux
          fi

  e2e:
    name: E2E (${{ matrix.os }})
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore file timestamps
        uses: chetan/git-restore-mtime-action@v2

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.os }}-cargo-build-dev-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('crates/**', 'Cargo.toml') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-build-dev-${{ hashFiles('**/Cargo.lock') }}-
            ${{ matrix.os }}-cargo-build-dev-

      - name: E2E tests
        run: |
          cargo run -p relux -- check --manifest tests/Relux.toml
          cargo run -p relux -- run --manifest tests/Relux.toml --timeout-multiplier 3.0

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/relux/out/
          retention-days: 7
