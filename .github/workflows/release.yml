name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('crates/**', 'Cargo.toml') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}-
            ${{ matrix.target }}-cargo-release-

      - name: Build release binary
        run: cargo build --release -p relux --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../relux-${{ github.ref_name }}-${{ matrix.target }}.tar.gz relux
          cd ../../..

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: relux-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  vscode-plugin:
    name: VSCode Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Package VSCode extension
        working-directory: editors/vscode
        run: |
          npm install -g @vscode/vsce
          vsce package --out ../../relux-vscode-${{ github.ref_name }}.vsix

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: relux-vscode-${{ github.ref_name }}.vsix

      - name: Upload .vsix as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-vsix
          path: relux-vscode-${{ github.ref_name }}.vsix
          retention-days: 7

  vscode-publish:
    name: VSCode Publish
    needs: [vscode-plugin]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download .vsix artifact
        uses: actions/download-artifact@v7
        with:
          name: vscode-vsix

      - name: Publish to VS Code Marketplace
        run: |
          npm install -g @vscode/vsce
          if output=$(vsce publish --packagePath relux-vscode-${{ github.ref_name }}.vsix 2>&1); then
            echo "$output"
            echo "Published relux ${{ github.ref_name }} to the VS Code Marketplace."
            exit 0
          fi
          if echo "$output" | grep -qE "already exists|already published"; then
            echo "Version already published to VS Marketplace, skipping."
          else
            echo "$output"
            exit 1
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: |
          npm install -g ovsx
          if output=$(ovsx publish relux-vscode-${{ github.ref_name }}.vsix 2>&1); then
            echo "$output"
            echo "Published relux ${{ github.ref_name }} to Open VSX."
            exit 0
          fi
          if echo "$output" | grep -qE "already exists|already published"; then
            echo "Version already published to Open VSX, skipping."
          else
            echo "$output"
            exit 1
          fi
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  publish:
    name: Publish to crates.io
    needs: [build]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}

      # Publish all workspace crates in dependency order.
      # --no-verify: build job already validated compilation.
      # Retries with backoff handle crates.io rate limits for new crates.
      - name: Publish
        run: |
          publish_crate() {
            local crate=$1
            for attempt in 1 2 3; do
              echo "Publishing $crate (attempt $attempt)..."
              if output=$(cargo publish -p "$crate" --no-verify 2>&1); then
                echo "Published $crate to crates.io."
                return 0
              fi
              if echo "$output" | grep -q -e "already uploaded" -e "already exists"; then
                echo "$crate already published, skipping."
                return 0
              fi
              echo "$output"
              if [ "$attempt" -lt 3 ]; then
                echo "Retrying in 120s..."
                sleep 120
              fi
            done
            echo "::error::Failed to publish $crate after 3 attempts"
            return 1
          }

          for crate in relux-core relux-ast relux-lexer relux-ir relux-parser relux-runtime relux-resolver relux; do
            publish_crate "$crate"
            if [ "$crate" != "relux" ]; then
              sleep 60
            fi
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  intellij-plugin:
    name: IntelliJ Plugin
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Pinned, not the runner's default. Gradle floated from 9.6.1 to 9.7.0
      # between v0.8.1 and v0.8.2, and 9.7.0 repackages an ASM that drops the
      # `ClassReader(InputStream)` constructor the IntelliJ Platform plugin's
      # `:instrumentCode` task calls -- so v0.8.2 failed on unchanged sources.
      # Raise this deliberately, together with `org.jetbrains.intellij.platform`
      # in `editors/intellij/settings.gradle.kts`.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.6.1

      - name: Build IntelliJ plugin
        working-directory: editors/intellij
        run: |
          gradle buildPlugin --info
          cp build/distributions/*.zip ../../relux-intellij-${{ github.ref_name }}.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: relux-intellij-${{ github.ref_name }}.zip

      - name: Publish to JetBrains Marketplace
        working-directory: editors/intellij
        run: |
          if output=$(gradle publishPlugin 2>&1); then
            echo "$output"
            echo "Published the relux plugin ${{ github.ref_name }} to the JetBrains Marketplace."
            exit 0
          fi
          if echo "$output" | grep -q "already contains version"; then
            echo "Plugin version already published, skipping."
          else
            echo "$output"
            exit 1
          fi
        env:
          JETBRAINS_PLUGIN_RELEASE_TOKEN: ${{ secrets.JETBRAINS_PLUGIN_RELEASE_TOKEN }}

  install-check:
    name: Install check (${{ matrix.target }})
    needs: [publish]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      # The x86_64-apple-darwin binary is built on an Apple Silicon runner,
      # so running `relux --version` executes an x86 binary through Rosetta 2.
      - name: Install Rosetta 2
        if: matrix.target == 'x86_64-apple-darwin'
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Install published crate and verify version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Verifying: cargo install relux@$VERSION for ${{ matrix.target }}"

          # Retry to absorb crates.io index propagation lag after `publish`.
          installed=false
          for attempt in 1 2 3 4 5; do
            echo "cargo install attempt $attempt..."
            if cargo install relux --version "$VERSION" --target ${{ matrix.target }}; then
              installed=true
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Install failed; crates.io index may still be propagating. Retrying in 30s..."
              sleep 30
            fi
          done
          if [ "$installed" != "true" ]; then
            echo "::error::Failed to cargo install relux@$VERSION for ${{ matrix.target }} after 5 attempts"
            exit 1
          fi

          reported="$(relux --version)"
          echo "relux --version -> $reported"
          case "$reported" in
            *"$VERSION"*)
              echo "Installed binary reports expected version $VERSION."
              ;;
            *)
              echo "::error::relux --version output '$reported' does not contain expected version $VERSION"
              exit 1
              ;;
          esac
