[package]
name = "relux-parser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Internal: parser for Relux. No semver guarantees."

[dependencies]
relux-core  = { workspace = true }
relux-lexer = { workspace = true }
relux-ast   = { workspace = true }
chumsky     = { workspace = true }
thiserror   = { workspace = true }
humantime   = { workspace = true }
rowan       = { workspace = true }

[features]
default = []
# Route parse() through the hand-written CST front end. Off during Story 0 so
# master is never broken by an incomplete grammar. Enabled workspace-wide with
# `--features relux-parser/cst-frontend`; no pass-through feature is needed in
# the crates that depend on this one.
cst-frontend = []
